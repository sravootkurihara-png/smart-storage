<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c487d">
<title>Smart Storage for construction work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one-column phone app — sticky top bar, scrolling view, fixed bottom tab bar. Blueprint blue accent on concrete greys. */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --sunken: #e3e7eb;
  --line: #d2d8de;
  --fg: #1b2530;
  --muted: #5b6875;
  --accent: #1d5f8f;
  --accent-ink: #ffffff;
  --accent-soft: #dceaf5;
  --good: #1f7a46;
  --good-soft: #dff1e6;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3261e;
  --bad-soft: #f9e0de;
  --info: #3b4fa8;
  --info-soft: #e2e6f8;
  --line-green: #06c755;
  --chat-bg: #8ca8c4;
  --bubble: #ffffff;
  --shadow: 0 1px 2px rgba(20,30,40,.08), 0 4px 14px rgba(20,30,40,.06);
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --surface: #1b2229; --sunken: #232c35; --line: #33404c;
    --fg: #e6ebf0; --muted: #9aa8b5; --accent: #6fb0e0; --accent-ink: #0d1a24; --accent-soft: #1d3446;
    --good: #5fcf8e; --good-soft: #17301f; --warn: #e5b04a; --warn-soft: #34290f; --bad: #f08b83; --bad-soft: #3a1a18;
    --info: #9fb0f5; --info-soft: #222a4a; --chat-bg: #2a3b4c; --bubble: #26313b;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1b2229; --sunken: #232c35; --line: #33404c;
  --fg: #e6ebf0; --muted: #9aa8b5; --accent: #6fb0e0; --accent-ink: #0d1a24; --accent-soft: #1d3446;
  --good: #5fcf8e; --good-soft: #17301f; --warn: #e5b04a; --warn-soft: #34290f; --bad: #f08b83; --bad-soft: #3a1a18;
  --info: #9fb0f5; --info-soft: #222a4a; --chat-bg: #2a3b4c; --bubble: #26313b;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: .01em; }
.brand span { font-size: 12px; color: var(--muted); }
.who {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px;
  background: var(--sunken); border: 1px solid var(--line); cursor: pointer; max-width: 55%;
}
.who .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.who .wn { font-size: 13px; line-height: 1.2; min-width: 0; }
.who .wn small { display: block; color: var(--muted); font-size: 11px; }
.who .wn div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main {
  max-width: 760px; margin: 0 auto;
  padding-block: 16px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab {
  border: 0; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-size: 12px; cursor: pointer; position: relative;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h1 { font-size: 22px; line-height: 1.3; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card.tap { cursor: pointer; }
.card.tap:hover { border-color: var(--accent); }
.flat { background: var(--sunken); border-radius: 10px; padding: 12px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--sunken); color: var(--muted); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input[type=text], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-height: 42px; width: 100%; color: var(--fg); font-size: 15px;
}
textarea { min-height: 64px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; } }

/* Scan screen */
.door { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
@media (max-width: 520px) { .door { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.qrframe { background: #fff; padding: 12px; border-radius: 10px; border: 3px solid var(--fg); width: 176px; height: 176px; display: grid; place-items: center; }
.qrframe img, .qrframe canvas { width: 148px !important; height: 148px !important; }
.qrframe .qrph { color: #5b6875; font-size: 12px; text-align: center; }
.sign-title { font-size: 20px; font-weight: 700; }
.bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bigbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 18px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.bigbtn svg { width: 30px; height: 30px; color: var(--accent); }
.bigbtn b { font-size: 18px; }
.bigbtn span { color: var(--muted); font-size: 13px; }
.bigbtn:hover { border-color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; }
.kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); }

/* PO cards */
.po-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.po-no { font-family: var(--font-mono); font-weight: 600; }
.meta { font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* receive lines */
.line-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.line-item.fail { border-color: var(--bad); background: linear-gradient(var(--bad-soft), var(--bad-soft)) padding-box; }
.li-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.li-name { font-weight: 600; min-width: 0; }
.li-code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.li-nums { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 14px; font-size: 12px; color: var(--muted); text-align: right; }
.li-nums b { font-size: 15px; color: var(--fg); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; cursor: pointer; font-weight: 600; min-height: 42px; }
.seg button[aria-pressed="true"].ok { background: var(--good); color: #fff; }
.seg button[aria-pressed="true"].ng { background: var(--bad); color: #fff; }
.qty { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.qty button { border: 0; background: var(--sunken); width: 42px; min-height: 42px; font-size: 20px; cursor: pointer; }
.qty input { border: 0; border-radius: 0; text-align: center; width: 72px; min-height: 42px; font-family: var(--font-mono); font-weight: 600; }
.photo-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); background: var(--sunken); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.hint { font-size: 12px; color: var(--muted); }
.measure-flag { font-size: 12px; font-weight: 600; }
.measure-flag.ok { color: var(--good); } .measure-flag.ng { color: var(--bad); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }

/* LINE chat */
.chat { background: var(--chat-bg); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.chat-head { background: #273444; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.chat-head .gi { width: 34px; height: 34px; border-radius: 50%; background: var(--line-green); display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
.chat-head small { display: block; color: #b9c6d3; font-size: 12px; }
.chat-body { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: start; }
.msg .bot { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #273444; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 2px solid var(--line-green); }
.msg .nm { font-size: 12px; color: #f3f6f9; margin-bottom: 3px; }
.msg .bub { background: var(--bubble); color: var(--fg); border-radius: 4px 14px 14px 14px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; max-width: 520px; }
.msg .tm { font-size: 11px; color: #e4ebf2; margin-top: 3px; }
.chat-empty { color: #f3f6f9; text-align: center; padding: 24px 8px; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); background: var(--sunken); border-radius: 10px; padding: 10px 12px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,22,.55); display: flex; align-items: flex-end; justify-content: center; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
.sheet { background: var(--surface); width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding-block: 16px max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 16px; max-height: 90%; } }
.podoc { background: #fff; color: #1b2530; border: 1px solid #c9d0d7; border-radius: 4px; padding: 20px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.podoc h3 { margin: 0; font-size: 18px; letter-spacing: .04em; }
.podoc table { font-size: 13px; }
.podoc th { background: #eef1f4; color: #39454f; }
.podoc td, .podoc th { border-bottom: 1px solid #dde2e7; }
.podoc .pdfbar { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: #6b7783; margin: -8px -8px 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: 14px; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } } }

/* ===== Smart Storage for construction work theme — Thai Takasago navy→sky gradient, glassy hero, soft cards ===== */
:root {
  --brand-navy: #0c2458; --brand-mid: #1c487d; --brand-sky: #3d8ac2; --brand-ice: #8fc3ea;
  --grad: linear-gradient(120deg, #0c2458 0%, #1c487d 48%, #3d8ac2 100%);
  --bg: #eef2f8; --surface: #ffffff; --sunken: #e8eef6; --line: #d6dfeb;
  --fg: #0e1b33; --muted: #58677f; --accent: #1f5f9e; --accent-ink: #ffffff; --accent-soft: #e2edf9;
  --shadow: 0 1px 2px rgba(12,36,88,.06), 0 8px 24px rgba(12,36,88,.08);
  --font-head: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081020; --surface: #111c31; --sunken: #182640; --line: #24344f;
    --fg: #e8eef8; --muted: #93a4bf; --accent: #6fb3ea; --accent-ink: #081020; --accent-soft: #15304f;
    --shadow: 0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #081020; --surface: #111c31; --sunken: #182640; --line: #24344f;
  --fg: #e8eef8; --muted: #93a4bf; --accent: #6fb3ea; --accent-ink: #081020; --accent-soft: #15304f;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
}
h1, h2, .sign-title, .bigbtn b, .hero-title { font-family: var(--font-head); letter-spacing: -0.01em; }
h1 { font-weight: 600; }
.card { border-radius: 16px; border-color: transparent; }
.line-item { border-radius: 14px; }
.btn { border-radius: 12px; }
.btn.primary { background: var(--grad); border: 0; color: #fff; box-shadow: 0 6px 18px rgba(12,36,88,.28); }
.btn.primary:disabled { box-shadow: none; }
.btn.ghost { color: var(--accent); }
input[type=text], input[type=number], input[type=date], select, textarea { border-radius: 10px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand-sky); outline-offset: 1px; }

/* header with company logo */
.topbar { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
body::before { background: var(--surface); }
.brand { gap: 3px; }
.brand .logo { height: 26px; width: auto; max-width: 100%; align-self: flex-start; object-fit: contain; }
.brand .product { font-size: 11.5px; font-weight: 600; color: var(--accent); letter-spacing: .02em; line-height: 1.35; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .logo { background: #fff; border-radius: 6px; padding: 3px 6px; } }
:root[data-theme="dark"] .brand .logo { background: #fff; border-radius: 6px; padding: 3px 6px; }
@media (max-width: 380px) { .brand .logo { height: 22px; } }
.who { background: var(--sunken); border-color: transparent; }
.who .av { background: var(--grad); color: #fff; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 20px; padding: 20px 18px 16px; color: #fff; background: var(--grad); box-shadow: 0 12px 32px rgba(12,36,88,.30); display: flex; flex-direction: column; gap: 6px; }
.hero::after { content: ""; position: absolute; right: -40px; top: -30px; width: 220px; height: 220px; pointer-events: none;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 6px, transparent 6px 16px); border-radius: 50%; -webkit-mask-image: radial-gradient(closest-side, #000 60%, transparent); mask-image: radial-gradient(closest-side, #000 60%, transparent); }
.hero-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; position: relative; z-index: 1; }
.hero-chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); padding: 3px 10px; border-radius: 999px; font-weight: 600; }
.hero-date { opacity: .8; font-variant-numeric: tabular-nums; }
.hero-title { font-size: 30px; line-height: 1.15; margin: 8px 0 0; color: #fff; font-weight: 700; position: relative; z-index: 1; }
.hero-sub { margin: 0; color: rgba(255,255,255,.85); font-size: 14px; position: relative; z-index: 1; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; position: relative; z-index: 1; }
.hs { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 14px; padding: 10px; text-align: left; cursor: pointer; backdrop-filter: blur(6px); }
.hs b { display: block; font-family: var(--font-head); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hs span { font-size: 11.5px; opacity: .9; }
.hs.alert { background: rgba(255,92,80,.28); border-color: rgba(255,150,140,.55); }
.hs.warn { background: rgba(255,196,64,.22); border-color: rgba(255,214,120,.5); }
.hs:hover { background: rgba(255,255,255,.2); }

/* big actions */
.bigbtn { border-radius: 18px; border: 0; position: relative; overflow: hidden; }
.bigbtn svg { width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.bigbtn:first-child { background: var(--grad); color: #fff; }
.bigbtn:first-child svg { background: rgba(255,255,255,.18); color: #fff; }
.bigbtn:first-child span { color: rgba(255,255,255,.85); }

/* door QR card */
.qrframe { border: 0; box-shadow: inset 0 0 0 3px var(--brand-navy); border-radius: 14px; }

/* bottom tabs: active pill */
.tabbar { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.tab svg { padding: 3px 14px; width: 52px; height: 30px; border-radius: 999px; box-sizing: border-box; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { background: var(--accent-soft); }

/* progress & pills */
.bar i { background: var(--grad); }
.pill { border-radius: 8px; }
.seg button[aria-pressed="true"].ok { background: #1f8a50; }

/* LINE preview keeps LINE's own look */
.chat-head { background: var(--brand-navy); }

/* ---- ปุ่มต้องดูออกว่ากดได้ ---- */
.btn { border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); background: var(--surface);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 35%, transparent), 0 3px 8px rgba(12,36,88,.10); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled), .bigbtn:active, .kpi:active, .hs:active, .card.tap:active { transform: translateY(2px); box-shadow: none; }
.btn.primary { color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad); box-shadow: 0 2px 0 color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.ghost { background: var(--accent-soft); border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: none; text-decoration: none; }
.btn:disabled { box-shadow: none; }
.card.tap, .kpi, .bigbtn, .hs { position: relative; }
.card.tap { border: 1.5px solid color-mix(in srgb, var(--accent) 30%, var(--line)); padding-right: 34px; box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 25%, transparent), var(--shadow); }
.kpi { border: 1.5px solid color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 25%, transparent); padding-right: 26px; }
.bigbtn { box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 30%, transparent), 0 6px 16px rgba(12,36,88,.12); padding-right: 34px; }
.card.tap::after, .kpi::after, .bigbtn::after { content: "›"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 26px; font-weight: 700; color: var(--accent); opacity: .75; pointer-events: none; }
.bigbtn:first-child::after { color: #fff; }
.hs::after { content: "แตะดู ›"; position: absolute; right: 8px; top: 6px; font-size: 10px; opacity: .8; }
tr.click td:last-child::after { content: " ›"; color: var(--accent); font-weight: 700; }
.who { border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent); }
/* ปุ่มถ่ายรูป + ปุ่มเลือกจากคลังภาพ */
.picks { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.picks.block { width: 100%; }
.picks.block .filebtn { flex: 1 1 0; }
.picks .filebtn { white-space: nowrap; }
.btn.gal { background: var(--surface); }
</style>

<script>
(() => {
  "use strict";
  // Set after first publish so the door QR opens this app.
  let APP_URL = "";
  let SITE = "";
  let ZONES = [];
  // เรียก Google Apps Script แบบไม่ส่งคุกกี้บัญชี Google (credentials: "omit") จึงไม่ติดปัญหามือถือล็อกอินหลายบัญชี
  const call = async (fn, ...args) => {
    let r;
    try {
      r = await fetch(window.SS_API, { method: "POST", credentials: "omit", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) });
    } catch (e) { throw new Error("ต่อเซิร์ฟเวอร์ไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่"); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error("เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (เช็กว่าทำให้ใช้งานได้เป็น เวอร์ชันใหม่ และสิทธิ์ = ทุกคน)"); }
    if (!j.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
    return j.data;
  };
  const driveImg = id => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800`;
  const ROLES = ["วิศวกร", "ช่าง", "จัดซื้อ", "PM"];

  const S = {
    db: null, ready: false, offline: false,
    items: [], pos: [], ledger: [], grns: [], ncrs: [], issues: [], lines: [],
    route: "scan", poOpen: null, recv: null, issueCart: [], issueForm: { zone: "", job: "" },
    stockFilter: "", itemDetail: null, confirmReset: false, busy: false,
  };

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtN = n => Number(n || 0).toLocaleString("th-TH");
  const pad = (n, w = 3) => String(n).padStart(w, "0");
  const now = () => new Date().toISOString();
  const tsTH = iso => { const d = new Date(iso); return `${pad(d.getDate(),2)}/${pad(d.getMonth()+1,2)}/${d.getFullYear()} ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`; };
  const dateTH = s => { if (!s) return "-"; const [y,m,d] = s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
  const timeOnly = iso => { const d = new Date(iso); return `${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`; };
  const yymm = () => { const d = new Date(); return String(d.getFullYear()).slice(2) + pad(d.getMonth()+1, 2); };
  const nextNo = (prefix, list) => {
    const key = `${prefix}-${yymm()}-`;
    const max = list.reduce((m, x) => (x.no || "").startsWith(key) ? Math.max(m, parseInt(x.no.slice(key.length), 10) || 0) : m, 0);
    return key + pad(max + 1);
  };
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const item = code => S.items.find(i => i.code === code) || { code, name: code, unit: "" };
  const me = () => lsGet("store.me") || { name: "", role: "วิศวกร" };
  const actor = () => { const m = me(); return m.name ? `${m.name} (${m.role})` : `ผู้ใช้ไม่ระบุชื่อ (${m.role})`; };

  function toast(msg) {
    const r = $("#toastRoot");
    r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ""; }, 2600);
  }

  // ---------- stock math ----------
  function stockOf(code) { return S.stock[code] || { usable: 0, hold: 0 }; }
  function receivedFor(poNo, code) { return ((S.poRecv || {})[poNo] || {})[code] || 0; }
  function poProgress(po) {
    let ordered = 0, got = 0, outstandingLines = 0;
    for (const ln of po.lines || []) {
      const rec = Math.min(receivedFor(po.poNo, ln.code), ln.qty);
      ordered += ln.qty; got += rec; if (rec < ln.qty) outstandingLines++;
    }
    return { ordered, got, outstandingLines, closed: outstandingLines === 0 };
  }
  const openPOs = () => S.pos.filter(p => !poProgress(p).closed).sort((a, b) => (a.due || "").localeCompare(b.due || ""));
  const today = () => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); } catch (e) { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); } };

  // ---------- photos ----------
  function compress(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = () => rej(new Error("อ่านไฟล์ไม่ได้"));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => rej(new Error("ไฟล์นี้ไม่ใช่รูปภาพ"));
        img.onload = () => {
          const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.62));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  // Android + LINE in-app browser ignores capture="environment" -> offer to reopen in Chrome
  function inAppHint() {
    const ua = navigator.userAgent || "";
    if (!/Android/i.test(ua) || !/\bLine\//i.test(ua) || !APP_URL || document.getElementById("inappHint")) return;
    const url = APP_URL.split("?")[0] + "?openExternalBrowser=1";

  function dataUrlToBlob(d) { const [h, b64] = d.split(","); const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return Promise.resolve(new Blob([u], { type: (h.match(/data:([^;]+)/) || [])[1] || "image/jpeg" })); }

    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = () => rej(new Error("อ่านไฟล์ไม่ได้"));
      fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("ไฟล์นี้ไม่ใช่รูปภาพ"));

          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q)); };
        img.src = fr.result; };

    });
  }

        const f = cam.files && cam.files[0]; if (!f) return;
        try { R.pages.push({ lo: await compressAt(f, 900, 0.62), hi: await compressAt(f, 1500, 0.75) }); R.readNote = ""; render(); }
        catch (e) { toast(e.message); }
      };
      const rb = $("#readBtn"); if (rb) rb.onclick = readDo;
      const st = $("#stopRead"); if (st) st.onclick = () => { if (R.ctl) R.ctl.abort(); };
      const nd = $("#noDoBtn"); if (nd) nd.onclick = startNoDo;
      const mn = $("#manual"); if (mn) mn.onclick = () => { R.stage = "list"; R.rows = rowsFromPo(po); R.readNote = "ติ๊กเฉพาะรายการที่อยู่ในใบส่งของ และแก้จำนวนให้ตรงกับใบส่งของ"; render(); };
      return;
    }

    const rowReady = r => r.qty > 0 && (r.typed || r.checked) && r.code && (r.code !== "__new__" || r.newName.trim());
    const ready = R.rows.filter(rowReady);
    const unchecked = R.rows.filter(r => !r.typed && !r.checked).length;
    const nonTyped = R.rows.filter(r => !r.typed).length;
    const missing = po ? po.lines.filter(l => outstandingOf(po, l.code) > 0 && !R.rows.some(r => r.code === l.code)) : [];
    const anyFail = ready.some(r => !r.pass);
    const needGoods = R.noDo && !R.goods.length;
    $("#view").innerHTML = head + `
      ${R.noDo ? `<section class="card stack">
        <span class="eyebrow">ขั้นที่ 2 จาก 2 · ไม่มีใบส่งของ</span>
        <div class="f"><span>รูปของที่มาส่ง (อย่างน้อย 1 รูป)</span></div>
        ${R.goods.length ? thumbStrip(R.goods, "goods") : ""}
        <div class="picks block"><label class="btn ${R.goods.length ? "" : "primary"} filebtn cam">📷 ${R.goods.length ? "+ ถ่ายรูปเพิ่ม" : "ถ่ายรูปของที่มาส่ง"}<input type="file" accept="image/*" capture="environment" id="goodsCam"></label><label class="btn ${R.goods.length ? "" : ""} filebtn gal">🖼️ จากคลังภาพ<input type="file" accept="image/*" data-for="goodsCam"></label></div>
        ${R.readNote ? `<div class="note">${esc(R.readNote)}</div>` : ""}
        <button class="btn ghost small" id="toPhoto" type="button">มีใบส่งของ กลับไปถ่ายใบส่งของ</button>
      </section>` : `<section class="card stack">
        <span class="eyebrow">ขั้นที่ 2 จาก 2 · เช็คลิสต์จากใบส่งของ</span>
        ${R.pages.length ? thumbStrip(R.pages, "page") : ""}
        ${R.doNo ? `<div class="meta">เลขที่ใบส่งของ (อ่านจากรูป): <b>${esc(R.doNo)}</b></div>` : ""}
        ${R.readNote ? `<div class="note">${esc(R.readNote)}</div>` : ""}
        ${R.pages.length ? "" : `<button class="btn small" id="toPhoto" type="button">ถ่ายรูปใบส่งของให้ระบบอ่าน</button>`}
      </section>`}
      <section class="section">
        <div class="spread"><span class="eyebrow">${R.noDo ? "รายการของที่มาส่ง" : "ติ๊กเมื่อนับของจริงตรงกับใบส่งของ"}</span>
          ${nonTyped ? `<span class="pill ${unchecked ? "warn" : "good"}">${nonTyped - unchecked}/${nonTyped} ติ๊กแล้ว</span>` : `<span class="pill mute">${R.rows.length} รายการ</span>`}</div>
        <datalist id="itemNames">${S.items.map(i => `<option value="${esc(i.name)}"></option>`).join("")}</datalist>
        ${R.rows.map((r, i) => r.typed ? typedRowHtml(po, r, i) : checkRow(po, r, i)).join("") || `<div class="card empty">ยังไม่มีรายการ กด "+ เพิ่มรายการ"</div>`}
        <button class="btn small" id="addRow" type="button">+ เพิ่มรายการ</button>
      </section>
      ${missing.length ? `<div class="banner warn">ไม่มาในเที่ยวนี้ (ยังค้างส่งตาม PO): ${missing.map(l => `${esc(item(l.code).name)} ${fmtN(outstandingOf(po, l.code))} ${esc(item(l.code).unit)}`).join(", ")}</div>` : ""}
      ${R.noDo ? "" : `<section class="card stack">
        <div class="f"><span>รูปกองของ (ไม่บังคับ)</span></div>
        ${R.goods.length ? thumbStrip(R.goods, "goods") : ""}
        <div class="picks" style="align-self:flex-start"><label class="btn small filebtn cam">📷 ${R.goods.length ? "+ ถ่ายเพิ่ม" : "ถ่ายรูปกองของ"}<input type="file" accept="image/*" capture="environment" id="goodsCam"></label><label class="btn small filebtn gal">🖼️ จากคลังภาพ<input type="file" accept="image/*" data-for="goodsCam"></label></div>
      </section>`}
      ${anyFail ? `<div class="banner bad">มีรายการแจ้งปัญหา ของส่วนนั้นจะเข้าสต๊อกพัก ห้ามเบิก และเปิด NCR ให้ PM ตัดสิน</div>` : ""}
      ${unchecked && ready.length ? `<p class="hint" style="margin:0;text-align:center">ยังไม่ติ๊ก ${unchecked} รายการ รายการที่ไม่ติ๊กจะไม่ถูกบันทึก</p>` : ""}
      ${needGoods ? `<p class="hint" style="margin:0;text-align:center">ถ่ายรูปของที่มาส่งก่อน จึงจะบันทึกได้</p>` : ""}
      <button class="btn primary block" id="submitRecv" type="button" ${S.busy || !ready.length || needGoods ? "disabled" : ""}>${S.busy ? "กำลังบันทึก…" : `บันทึกรับของ ${ready.length} รายการ และแจ้ง LINE`}</button>
      <p class="hint" style="text-align:center">ผู้รับ: ${esc(actor())}</p>`;
    bindHead(); bindThumbs(); bindGoodsCam();
    const dn = $("#doNo"); if (dn) dn.oninput = e => { R.doNo = e.target.value; };
    const tp = $("#toPhoto"); if (tp) tp.onclick = () => { R.noDo = false; R.stage = "photo"; R.readNote = ""; render(); };
    $("#addRow").onclick = () => { R.rows.push(R.noDo || !R.pages.length && !po ? typedRow() : blankRow()); render(); };
    R.rows.forEach((r, i) => r.typed ? bindTypedRow(r, i) : bindCheckRow(r, i));
    $("#submitRecv").onclick = submitReceive;
  }

  function typedRowHtml(po, r, i) {
    const isNew = r.code === "__new__";
    const it = r.code && !isNew ? item(r.code) : null;
    const inPo = r.code && poLine(po, r.code);
    const out = inPo ? outstandingOf(po, r.code) : 0;
    let flag = "";
    if (!r.typedName.trim()) flag = `<span class="pill mute">พิมพ์ชื่อรายการ</span>`;
    else if (isNew) flag = `<span class="pill info">ของใหม่ จะเพิ่มเข้ารายการสโตร์</span>`;
    else if (po && !inPo) flag = `<span class="pill warn">ไม่อยู่ใน PO นี้</span>`;
    else if (po && r.qty < out) flag = `<span class="pill info">จะค้างส่งอีก ${fmtN(out - r.qty)}</span>`;
    else if (po && r.qty > out) flag = `<span class="pill warn">เกินยอดค้าง ${fmtN(r.qty - out)}</span>`;
    else if (po) flag = `<span class="pill good">ครบตาม PO</span>`;
    else flag = `<span class="pill good">มีในสโตร์ ${fmtN(stockOf(r.code).usable)} ${esc(it.unit)}</span>`;
    return `<div class="line-item ${!r.pass ? "fail" : ""}">
      <label class="f">ชื่อรายการ<input type="text" id="tn${i}" list="itemNames" value="${esc(r.typedName)}" placeholder="พิมพ์ชื่อ เช่น ท่อ PVC 2&quot; หรือ กาวทาท่อ" autocomplete="off"></label>
      <div class="spread">
        <div class="stack" style="gap:4px"><span class="hint">จำนวน</span>
          <div class="qty"><button type="button" data-tdec="${i}" aria-label="ลด">−</button><input type="number" inputmode="numeric" min="0" id="tq${i}" value="${r.qty}"><button type="button" data-tinc="${i}" aria-label="เพิ่ม">+</button></div></div>
        ${isNew ? `<label class="f" style="width:120px">หน่วย<input type="text" id="tu${i}" value="${esc(r.newUnit)}" placeholder="เช่น ชิ้น"></label>`
          : `<div class="stack" style="gap:4px;text-align:right"><span class="hint">หน่วย</span><b>${it ? esc(it.unit) : "-"}</b></div>`}
      </div>
      <div class="row">${flag}
        <button class="btn ghost small" type="button" data-tprob="${i}">${r.pass ? "แจ้งปัญหา" : "ยกเลิกแจ้งปัญหา"}</button>
        <button class="btn ghost small" type="button" data-tdel="${i}">ลบ</button></div>
      ${!r.pass ? `<label class="f">สาเหตุ (ชำรุด / ไม่ตรงสเปก / ไซซ์ผิด)<input type="text" id="tr${i}" value="${esc(r.note)}" placeholder="เช่น ท่อแตก 2 เส้น"></label>
        ${photoField("tp" + i, r.photo, "ถ่ายรูปจุดที่มีปัญหา")}` : ""}
    </div>`;
  }
  function bindTypedRow(r, i) {
    const tn = $("#tn" + i);
    tn.onchange = () => { setTyped(r, tn.value); render(); };
    tn.oninput = () => { const before = r.code; setTyped(r, tn.value); if ((before === "__new__") !== (r.code === "__new__") || (r.code !== "__new__" && before !== r.code)) { const p = tn.selectionStart; render(); const n = $("#tn" + i); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch {} } } };
    const q = $("#tq" + i); q.onchange = () => { r.qty = Math.max(0, parseInt(q.value, 10) || 0); render(); };
    $(`[data-tdec="${i}"]`).onclick = () => { r.qty = Math.max(0, r.qty - 1); render(); };
    $(`[data-tinc="${i}"]`).onclick = () => { r.qty += 1; render(); };
    $(`[data-tprob="${i}"]`).onclick = () => { r.pass = !r.pass; render(); };
    $(`[data-tdel="${i}"]`).onclick = () => { S.recv.rows.splice(i, 1); render(); };
    const tu = $("#tu" + i); if (tu) tu.oninput = () => { r.newUnit = tu.value; };
    const tr = $("#tr" + i); if (tr) tr.oninput = () => { r.note = tr.value; };
    bindPhoto("tp" + i, d => { r.photo = d; });
  }

  function checkRow(po, r, i) {
    const isNew = r.code === "__new__";
    const it = r.code && !isNew ? item(r.code) : null;
    const inPo = r.code && poLine(po, r.code);
    const out = inPo ? outstandingOf(po, r.code) : 0;
    let flag = "";
    if (!r.code) flag = `<span class="pill bad">เลือกว่าเป็นของรายการไหน</span>`;
    else if (isNew) flag = `<span class="pill info">ของใหม่ จะเพิ่มเข้ารายการสโตร์</span>`;
    else if (po && !inPo) flag = `<span class="pill warn">ไม่อยู่ใน PO นี้</span>`;
    else if (po && r.qty > out) flag = `<span class="pill warn">เกินยอดค้าง ${fmtN(r.qty - out)}</span>`;
    else if (po && r.qty < out) flag = `<span class="pill info">จะค้างส่งอีก ${fmtN(out - r.qty)}</span>`;
    else if (po) flag = `<span class="pill good">ครบตาม PO</span>`;
    return `<div class="line-item ${r.checked && !r.pass ? "fail" : ""}" style="${r.checked && r.pass ? "border-color:var(--good)" : ""}">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
        <input type="checkbox" id="ck${i}" ${r.checked ? "checked" : ""} aria-label="ตรวจนับแล้ว" style="width:26px;height:26px;margin-top:6px;flex:none;accent-color:var(--good)">
        <div class="stack" style="gap:6px;flex:1;min-width:0">
          <select id="rc${i}" aria-label="รายการวัสดุ">
            <option value="">— เลือกรายการ —</option>
            ${S.items.map(x => `<option value="${esc(x.code)}" ${x.code === r.code ? "selected" : ""}>${esc(x.name)}${po && !poLine(po, x.code) ? " (นอก PO)" : ""}</option>`).join("")}
            <option value="__new__" ${isNew ? "selected" : ""}>+ ของใหม่ ยังไม่มีในรายการสโตร์</option>
          </select>
          ${r.doText ? `<div class="hint">ในใบส่งของเขียนว่า: “${esc(r.doText)}”${r.doUnit ? ` (${esc(r.doUnit)})` : ""}</div>` : ""}
          ${isNew ? `<div class="grid2"><label class="f">ชื่อรายการใหม่<input type="text" id="nn${i}" value="${esc(r.newName)}" placeholder="เช่น กาวทาท่อ PVC 500 กรัม"></label>
            <label class="f">หน่วย<input type="text" id="nu${i}" value="${esc(r.newUnit)}" placeholder="เช่น กระป๋อง"></label></div>` : ""}
          <div class="spread">
            <div class="qty"><button type="button" data-rdec="${i}" aria-label="ลด">−</button><input type="number" inputmode="numeric" min="0" id="rq${i}" value="${r.qty}"><button type="button" data-rinc="${i}" aria-label="เพิ่ม">+</button></div>
            <span class="hint">${it ? esc(it.unit) : isNew ? esc(r.newUnit) : ""}${inPo ? ` · สั่ง ${fmtN(inPo.qty)} ค้าง ${fmtN(out)}` : it ? ` · ในสโตร์ ${fmtN(stockOf(it.code).usable)}` : ""}</span>
          </div>
          <div class="row">${flag}
            <button class="btn ghost small" type="button" data-prob="${i}">${r.pass ? "แจ้งปัญหา" : "ยกเลิกแจ้งปัญหา"}</button>
            <button class="btn ghost small" type="button" data-rdel="${i}">ลบ</button></div>
          ${!r.pass ? `<label class="f">สาเหตุ (ชำรุด / ไม่ตรงสเปก / ไซซ์ผิด)<input type="text" id="rn${i}" value="${esc(r.note)}" placeholder="เช่น ท่อแตก 2 เส้น"></label>
            ${photoField("rp" + i, r.photo, "ถ่ายรูปจุดที่มีปัญหา")}` : ""}
        </div>
      </div></div>`;
  }
  function bindCheckRow(r, i) {
    $("#ck" + i).onchange = e => { r.checked = e.target.checked; render(); };
    $("#rc" + i).onchange = e => { r.code = e.target.value; if (r.code === "__new__") { r.newName = r.newName || r.doText; r.newUnit = r.newUnit || r.doUnit; } render(); };
    const q = $("#rq" + i); q.onchange = () => { r.qty = Math.max(0, parseInt(q.value, 10) || 0); render(); };
    $(`[data-rdec="${i}"]`).onclick = () => { r.qty = Math.max(0, r.qty - 1); render(); };
    $(`[data-rinc="${i}"]`).onclick = () => { r.qty += 1; render(); };
    $(`[data-prob="${i}"]`).onclick = () => { r.pass = !r.pass; if (!r.pass) r.checked = true; render(); };
    $(`[data-rdel="${i}"]`).onclick = () => { S.recv.rows.splice(i, 1); render(); };
    const nn = $("#nn" + i); if (nn) nn.oninput = () => { r.newName = nn.value; };
    const nu = $("#nu" + i); if (nu) nu.oninput = () => { r.newUnit = nu.value; };
    const n = $("#rn" + i); if (n) n.oninput = () => { r.note = n.value; };
    bindPhoto("rp" + i, d => { r.photo = d; });
  }
  function photoField(id, data, label) {
    return `<div class="photo-in">${data ? `<img class="thumb" src="${data}" alt="">` : ""}
      <div class="picks"><label class="btn small filebtn cam">📷 ${data ? "ถ่ายใหม่" : esc(label)}<input type="file" accept="image/*" capture="environment" id="${id}"></label><label class="btn small filebtn gal">🖼️ จากคลังภาพ<input type="file" accept="image/*" data-for="${id}"></label></div></div>`;
  }
  function bindPhoto(id, set) {
    const inp = document.getElementById(id); if (!inp) return;
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try { set(await compress(f)); render(); } catch (e) { toast(e.message); }
    };
  }
  function showImage(src, label) {
    $("#modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="sheet">
      <div class="spread"><h2>${esc(label)}</h2><button class="btn ghost small" data-close type="button">ปิด</button></div>
      <img src="${src}" alt="${esc(label)}" style="width:100%;border-radius:8px"></div></div>`;
    $("[data-close]").onclick = closeModal;
  }

  async function submitReceive() {
    const R = S.recv, po = curPo();
    const rows = R.rows.filter(r => r.qty > 0 && (r.typed || r.checked) && r.code && (r.code !== "__new__" || r.newName.trim()));
    if (!rows.length) return toast(R.noDo ? "พิมพ์ชื่อรายการและจำนวนอย่างน้อย 1 รายการ" : "ติ๊กรายการที่นับแล้วอย่างน้อย 1 รายการ");
    if (R.noDo && !R.goods.length) return toast("ถ่ายรูปของที่มาส่งอย่างน้อย 1 รูป");
    if (rows.find(r => !r.pass && !r.note.trim())) return toast("รายการที่แจ้งปัญหาต้องใส่สาเหตุ");
    S.busy = true; render();
    try {
      const res = await call("saveReceive", {
        by: actor(), poNo: po ? po.poNo : null, supplier: R.supplier, doNo: R.doNo, noDo: R.noDo,
        pages: R.pages.map(p => p.lo), goods: R.goods,
        rows: rows.map(r => ({ code: r.code, newName: r.newName, newUnit: r.newUnit, qty: r.qty, pass: r.pass, note: r.note, doText: r.doText || r.typedName || "", photo: r.photo })),
      });
      S.busy = false;
      if (!res.ok) { render(); return toast(res.error || "บันทึกไม่สำเร็จ"); }
      S.recv = null;
      toast(`บันทึก ${res.no} แล้ว · LINE: ${res.lineResult}`);
      await load(); go("line");
    } catch (e) {
      S.busy = false; render(); toast("บันทึกไม่สำเร็จ ตรวจสัญญาณเน็ตแล้วกดบันทึกอีกครั้ง");
    }
  }

  // ---------- PO form & PO doc ----------

    $("#modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="ใบสั่งซื้อ ${esc(p.poNo)}"><div class="sheet">

      <div class="podoc">

          <div><b>ผู้สั่ง</b><div>${esc(p.orderedBy)}</div></div><div><b>กำหนดส่ง</b><div>${dateTH(p.due)}</div></div></div>
        <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>#</th><th>รายการ</th><th>รหัส</th><th class="n">จำนวน</th><th>หน่วย</th></tr></thead>
        <tbody>${p.lines.map((l, i) => { const it = item(l.code); return `<tr><td>${i + 1}</td><td>${esc(it.name)}</td><td class="mono">${esc(it.code)}</td><td class="n">${fmtN(l.qty)}</td><td>${esc(it.unit)}</td></tr>`; }).join("")}</tbody></table></div>
      </div>
    </div></div>`;
    $("[data-close]").onclick = closeModal;

  function closeModal() { $("#modalRoot").innerHTML = ""; }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  document.addEventListener("click", e => { if (e.target.classList && e.target.classList.contains("modal")) closeModal(); });

  async function showGrn(id) {
    const g = S.grns.find(x => x.id === id); if (!g) return;

  function vIssue() {

      <section class="card stack">
        <label class="f">ค้นหาของ<input type="text" id="iq" placeholder="พิมพ์ชื่อหรือรหัส เช่น 2&quot; หรือ M12" value="${esc(S.issueQ || "")}"></label>
        <div class="stack">${list.map(it => { const s = stockOf(it.code); const inCart = cart.find(c => c.code === it.code);

      </section>
      <section class="card stack">
        <span class="eyebrow">ใบเบิก (${cart.length} รายการ)</span>

          return `<div class="stack" style="gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px">

            <div class="spread"><div class="qty"><button type="button" data-cdec="${i}" aria-label="ลด">−</button><input type="number" min="1" id="cq${i}" value="${c.qty}"><button type="button" data-cinc="${i}" aria-label="เพิ่ม">+</button></div>

            ${over ? `<div class="banner bad">เบิกเกินของที่มี (${fmtN(s.usable)} ${esc(it.unit)})</div>` : ""}</div>`; }).join("")
          : `<div class="empty">ยังไม่ได้เลือกของ กด "เลือก" จากรายการด้านบน</div>`}

          <label class="f">ใช้ที่โซน<select id="iz">${ZONES.map(z => `<option ${z === S.issueForm.zone ? "selected" : ""}>${esc(z)}</option>`).join("")}</select></label>
          <label class="f">งาน<input type="text" id="ij" placeholder="เช่น เดินท่อน้ำเย็น ห้องเครื่อง" value="${esc(S.issueForm.job)}"></label>
        </div>
        <div class="f"><span>รูปใบเบิก/ของที่เบิก (ไม่บังคับ)</span>${photoField("ip", S.issueForm.photo, "ถ่ายรูป")}</div>
        <button class="btn primary block" id="doIssue" type="button" ${!cart.length || S.busy || cart.some(c => c.qty > stockOf(c.code).usable || c.qty < 1) ? "disabled" : ""}>${S.busy ? "กำลังบันทึก…" : "ยืนยันเบิก และแจ้ง LINE"}</button>

          <div class="meta">${r.lines.map(l => `${esc(item(l.code).name)} ×${fmtN(l.qty)}`).join(" · ")}</div></div>`).join("")
        : `<div class="card empty">ยังไม่มีการเบิก</div>`}</section>`;

  async function submitIssue() {
    const cart = S.issueCart; if (!cart.length) return;
    if (!S.issueForm.job.trim()) return toast("กรอกชื่องานที่จะใช้ของ");
    S.busy = true; render();
    try {
      const res = await call("saveIssue", { by: actor(), zone: S.issueForm.zone, job: S.issueForm.job.trim(), photo: S.issueForm.photo || null, lines: cart.map(c => ({ code: c.code, qty: c.qty })) });
      S.busy = false;
      if (!res.ok) { render(); return toast(res.error || "บันทึกการเบิกไม่สำเร็จ"); }
      S.issueCart = []; S.issueForm = { zone: S.issueForm.zone, job: "" };
      toast(`เบิก ${res.no} แล้ว · LINE: ${res.lineResult}`);
      await load(); go("line");
    } catch (e) { S.busy = false; render(); toast("บันทึกการเบิกไม่สำเร็จ ลองอีกครั้ง"); }
  }

  // ---------- stock ----------
  function vStock() {
    const f = (S.stockFilter || "").toLowerCase();

      let onOrder = 0;
      for (const p of S.pos) for (const ln of p.lines) if (ln.code === it.code) onOrder += Math.max(0, ln.qty - receivedFor(p.poNo, ln.code));
      const low = it.reorder > 0 && s.usable <= it.reorder;
      return { it, ...s, onOrder, low };
    }).filter(r => !f || r.it.name.toLowerCase().includes(f) || r.it.code.toLowerCase().includes(f));

        <div class="spread"><span class="eyebrow">ของพักรอตัดสิน (NCR)</span>${ncrOpen.length ? `<span class="pill bad">${ncrOpen.length} รายการ</span>` : ""}</div>

            <div class="po-head"><span class="po-no">${esc(n.no)}</span>${days >= 7 ? `<span class="pill bad">ค้าง ${days} วัน</span>` : `<span class="pill warn">ค้าง ${days} วัน</span>`}</div>
            <div><b>${esc(it.name)}</b> · ${fmtN(n.qty)} ${esc(it.unit)}</div>
            <div class="meta">สาเหตุ: ${esc(n.reason)}<br>${esc(n.grnNo)} · ${n.poNo ? `PO ${esc(n.poNo)} · ` : ""}${esc(n.supplier)}</div>
            <div class="row"><button class="btn small" type="button" data-ncr="accept" data-id="${esc(n.id)}">ยอมรับ (PM อนุมัติ)</button>
              <button class="btn small danger" type="button" data-ncr="return" data-id="${esc(n.id)}">คืนผู้ขาย</button></div></div>`; }).join("")
        : `<div class="card empty">ไม่มีของพัก ของที่ตรวจไม่ผ่านตอนรับจะมาอยู่ที่นี่</div>`}
      </section>
      <section class="section">
        <div class="spread"><span class="eyebrow">ยอดคงเหลือ</span><input type="text" id="sf" placeholder="ค้นหา" value="${esc(S.stockFilter)}" style="max-width:180px"></div>
        <div class="tablewrap"><table><thead><tr><th>รายการ</th><th class="n">ใช้งานได้</th><th class="n">พัก</th><th>สถานะ</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-item="${esc(r.it.code)}" tabindex="0"><td><div style="font-weight:600">${esc(r.it.name)}</div><div class="li-code">${esc(r.it.code)} · ${esc(r.it.location)}</div></td>
          <td class="n"><b>${fmtN(r.usable)}</b> ${esc(r.it.unit)}</td><td class="n">${r.hold ? `<span style="color:var(--bad);font-weight:600">${fmtN(r.hold)}</span>` : "–"}</td>
          <td>${r.usable <= 0 ? `<span class="pill bad">หมด</span>` : r.low ? `<span class="pill warn">ต่ำกว่า ${fmtN(r.it.reorder)}</span>` : `<span class="pill good">ปกติ</span>`}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="hint">แตะแถวเพื่อดูประวัติเข้า–ออกของรายการนั้น</p>
      </section>
      <section class="card stack">
        <span class="eyebrow">ล้างข้อมูลช่วงทดลอง</span>
        <p class="hint" style="margin:0">ล้างประวัติรับ เบิก NCR และข้อความ LINE ในชีตทั้งหมด ยอดกลับไปเป็นยอดยกมา รายการวัสดุ PO และรูปใน Drive ยังอยู่ ใช้เฉพาะช่วงทดลองก่อนใช้งานจริง</p>
        ${S.confirmReset ? `<div class="row"><button class="btn danger" id="resetYes" type="button" ${S.busy ? "disabled" : ""}>${S.busy ? "กำลังล้าง…" : "ยืนยันล้างข้อมูล"}</button><button class="btn" id="resetNo" type="button">ยกเลิก</button></div>`

    document.querySelectorAll("[data-item]").forEach(tr => { const f2 = () => showItem(tr.dataset.item); tr.onclick = f2; tr.onkeydown = e => { if (e.key === "Enter") f2(); }; });
    document.querySelectorAll("[data-ncr]").forEach(b => b.onclick = () => decideNcr(b.dataset.id, b.dataset.ncr));
    const rs = $("#reset"); if (rs) rs.onclick = () => { S.confirmReset = true; render(); };
    const rn = $("#resetNo"); if (rn) rn.onclick = () => { S.confirmReset = false; render(); };

  async function showItem(code) {
    const it = item(code), s = stockOf(code);
    $("#modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="sheet"><div class="empty">กำลังโหลดประวัติ ${esc(it.name)}…</div></div></div>`;

    try { hist = await call("getItemHistory", code); } catch {}
    const TYPE = { receive: "รับเข้า", hold: "รับเข้าพัก", issue: "เบิก", accept: "ปลดพัก (ยอมรับ)", release: "ออกจากพัก", return: "คืนผู้ขาย" };
    $("#modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="sheet">
      <div class="spread"><div><h2>${esc(it.name)}</h2><div class="li-code">${esc(it.code)} · ที่เก็บ ${esc(it.location)}</div></div><button class="btn ghost small" data-close type="button">ปิด</button></div>
      <div class="kpis"><div class="kpi"><b>${fmtN(s.usable)}</b><span>ใช้งานได้ (${esc(it.unit)})</span></div><div class="kpi ${s.hold ? "bad" : ""}"><b>${fmtN(s.hold)}</b><span>พัก</span></div><div class="kpi"><b>${fmtN(it.openQty)}</b><span>ยอดยกมา</span></div></div>

      ${hist.map(h => `<tr><td class="num">${tsTH(h.at)}</td><td>${TYPE[h.type] || esc(h.type)}${h.bucket === "hold" ? ` <span class="pill bad">พัก</span>` : ""}<div class="hint">${esc(h.by)}</div></td><td class="mono">${esc(h.ref)}${(() => { const is = h.type === "issue" && S.issues.find(x => x.no === h.ref); return is && is.photo ? `<div><a class="btn ghost small" href="https://drive.google.com/file/d/${encodeURIComponent(is.photo)}/view" target="_blank" rel="noopener">📷 ดูรูป</a></div>` : ""; })()}</td><td class="n" style="color:${h.qty < 0 ? "var(--bad)" : "var(--good)"};font-weight:600">${h.qty > 0 ? "+" : ""}${fmtN(h.qty)}</td></tr>`).join("")
        || `<tr><td colspan="4" class="empty">ยังไม่มีการเคลื่อนไหว ยอดเท่ากับยอดยกมา</td></tr>`}
      </tbody></table></div></div></div>`;
    $("[data-close]").onclick = closeModal;
  }

  async function decideNcr(id, how) {
    const n = S.ncrs.find(x => x.id === id); if (!n || S.busy) return;
    S.busy = true;
    try {
      const res = await call("decideNcr", n.no, how, actor());
      if (!res.ok) toast(res.error || "บันทึกผลตัดสินไม่สำเร็จ");
      else { toast((how === "accept" ? `${n.no}: ยอมรับแล้ว` : `${n.no}: คืนผู้ขายแล้ว`) + ` · LINE: ${res.lineResult}`); await load(); }
    } catch { toast("บันทึกผลตัดสินไม่สำเร็จ ลองอีกครั้ง"); }
    S.busy = false; render();
  }

  async function resetSim() {
    S.busy = true; render();
    try { await call("resetTransactions"); toast("ล้างข้อมูลทดลองแล้ว ยอดกลับเป็นยอดยกมา"); await load(); }
    catch { toast("ล้างข้อมูลไม่สำเร็จ ลองอีกครั้ง"); }
    S.busy = false; S.confirmReset = false; render();
  }

      <button class="btn primary block" id="wSave" type="button">บันทึก</button></div></div>`;
    $("[data-close]").onclick = closeModal;
    $("#wSave").onclick = () => { lsSet("store.me", { name: $("#wN").value.trim(), role: $("#wR").value }); closeModal(); render(); };
  };

  // ---------- boot ----------
  const showErr = m => { const v = document.getElementById("view"); if (v) v.innerHTML = '<div class="card"><h2>ข้อผิดพลาด</h2><p class="sub" style="white-space:pre-wrap">' + String(m).replace(/</g, "&lt;") + '</p></div>'; };
  window.addEventListener("error", e => showErr((e.message || "") + " @บรรทัด " + e.lineno));
  window.addEventListener("unhandledrejection", e => showErr(String((e.reason && e.reason.message) || e.reason)));
  try { S.route = "scan"; render(); load(); } catch (e) { showErr((e && e.stack) || e); }
  setTimeout(() => { if (!S.ready && !S.offline) showErr("getState ไม่ตอบกลับภายใน 12 วินาที"); }, 12000);
})();

</script>
</body></html>
